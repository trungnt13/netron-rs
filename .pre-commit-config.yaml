repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: '(^|/)Cargo\.(toml|lock)$|\.rs$'
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        files: '(^|/)Cargo\.(toml|lock)$|\.rs$'
